#!/usr/sbin/nft -f
# Ravenfantom — Killswitch Tor (filtrage)

flush ruleset

define tor_uid = 112
define tor_socks_port = 9050
define tor_trans_port = 9040
define tor_dns_port = 5353
define tor_control_port = 9051

table inet ravenfantom {
    chain input {
        type filter hook input priority 0; policy drop;

        iif lo accept
        ct state established,related accept
        ct state invalid drop

        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } accept
        ip6 nexthdr ipv6-icmp icmpv6 type { echo-request, echo-reply, destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept

        udp dport 68 accept
        tcp dport 22 accept

        counter drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy drop;

        oif lo accept
        ct state established,related accept
        udp sport 67 udp dport 68 accept
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } accept

        meta skuid $tor_uid accept

        ip daddr 127.0.0.1 tcp dport { $tor_socks_port, $tor_trans_port, $tor_control_port } accept
        ip daddr 127.0.0.1 udp dport $tor_dns_port accept

        counter drop comment "leaks-blocked"
    }
}
