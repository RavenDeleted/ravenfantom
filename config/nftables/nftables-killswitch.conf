table inet ravenfantom {
	chain input {
		type filter hook input priority filter; policy drop;
		iifname "waydroid0" udp sport 68 udp dport 67 accept comment "waydroid-dhcp-disc"
		iifname "waydroid0" udp sport 67 udp dport 68 accept comment "waydroid-dhcp-resp"
		iifname "waydroid0" udp dport 5353 accept comment "waydroid-dns-tor"
		iifname "waydroid0" tcp dport 9040 accept comment "waydroid-tcp-tor"
		iif "lo" accept
		ct state established,related accept
		ct state invalid drop
		ip protocol icmp icmp type { destination-unreachable, echo-request, time-exceeded, parameter-problem } accept
		ip6 nexthdr ipv6-icmp icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, echo-request, echo-reply, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
		udp dport 68 accept
		tcp dport 22 accept
		counter packets 11 bytes 3740 drop
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
		iifname "waydroid0" oifname "lo" accept comment "waydroid-to-tor"
		iifname "lo" oifname "waydroid0" ct state established,related accept comment "tor-to-waydroid"
		iifname "eth0" oifname "waydroid0" ct state established,related accept comment "waydroid-return-internet"
		iifname "waydroid0" accept comment "waydroid-fwd-out"
		oifname "waydroid0" ct state established,related accept comment "waydroid-fwd-in"
	}

	chain output {
		type filter hook output priority filter; policy drop;
		oif "lo" accept
		ct state established,related accept
		udp sport 67 udp dport 68 accept
		ip protocol icmp icmp type { destination-unreachable, echo-request, time-exceeded } accept
		meta skuid 112 accept
		ip daddr 127.0.0.1 tcp dport { 9040, 9050, 9051 } accept
		ip daddr 127.0.0.1 udp dport 5353 accept
		counter packets 430 bytes 32020 drop comment "leaks-blocked"
	}
}
table ip ravenfantom_nat {
	chain output_dns {
		type nat hook output priority dstnat; policy accept;
		meta skuid != 112 udp dport 53 dnat to 127.0.0.1:5353
		meta skuid != 112 tcp dport 53 dnat to 127.0.0.1:5353
	}
}
table inet lxc {
	chain input {
		type filter hook input priority filter; policy accept;
		iifname "waydroid0" udp dport { 53, 67 } accept
		iifname "waydroid0" tcp dport { 53, 67 } accept
	}

	chain forward {
		type filter hook forward priority filter; policy accept;
		iifname "waydroid0" accept
		oifname "waydroid0" accept
	}
}
table ip lxc {
	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;
		ip saddr 192.168.240.0/24 ip daddr != 192.168.240.0/24 counter packets 0 bytes 0 masquerade
	}
}
table ip waydroid_nat {
	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;
		ip saddr 192.168.240.0/24 oifname "eth0" masquerade comment "waydroid-masq"
	}
}
table ip waydroid_tor {
	chain prerouting {
		type nat hook prerouting priority dstnat; policy accept;
		iifname "waydroid0" udp dport 53 dnat to 192.168.240.1:5353 comment "waydroid-dns"
		iifname "waydroid0" meta l4proto tcp dnat to 192.168.240.1:9040 comment "waydroid-tcp"
	}
}
